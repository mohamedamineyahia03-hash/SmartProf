<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartProf — Confirmation des virements</title>
<style>
  :root{
    --bg:#12162B; --surface:#1C2244; --surface-2:#242B52; --border:rgba(237,235,250,.1);
    --text:#EDEBFA; --muted:#9296C4; --accent:#FF3D77; --good:#34D399; --warn:#FFC93C;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px;}
  h1{font-size:1.4rem;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:.85rem;margin:0 0 20px;}
  .key-row{display:flex;gap:8px;margin-bottom:24px;}
  .key-row input{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);}
  .key-row button{padding:8px 14px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-weight:600;font-size:.85rem;background:var(--surface-2);color:var(--text);}
  .summary{margin-bottom:18px;font-size:.85rem;color:var(--muted);}
  .summary b{color:var(--text);}
  .row{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:12px;}
  .row-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;}
  .ref{font-family:ui-monospace,monospace;font-weight:700;color:var(--warn);font-size:1rem;}
  .meta{color:var(--muted);font-size:.82rem;margin-top:4px;}
  .row-actions{margin-top:12px;display:flex;gap:8px;align-items:center;}
  .row-actions input{width:100px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);}
  .btn-confirm{background:var(--good);color:#06231a;border:none;padding:7px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.82rem;}
  .btn-confirm:disabled{opacity:.5;cursor:default;}
  .empty{color:var(--muted);text-align:center;padding:60px 0;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);padding:10px 18px;border-radius:10px;font-size:.85rem;display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Confirmation des virements bancaires</h1>
  <p class="sub">Comparez la référence ci-dessous avec le libellé du virement sur votre relevé bancaire, puis confirmez.</p>

  <div class="key-row">
    <input id="adminKey" type="password" placeholder="Clé admin (X-Admin-Key)">
    <button id="saveKey">Charger</button>
  </div>

  <div class="summary" id="summary"></div>
  <div id="rows"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const keyInput = document.getElementById('adminKey');
const toast = document.getElementById('toast');
keyInput.value = localStorage.getItem('smartprof_payments_admin_key') || '';

function showToast(msg){
  toast.textContent = msg;
  toast.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.style.display = 'none', 2500);
}

async function callApi(path, opts = {}){
  const res = await fetch(path, {
    ...opts,
    headers: {'Content-Type': 'application/json', 'X-Admin-Key': keyInput.value, ...(opts.headers || {})},
  });
  if(res.status === 401){ showToast('Clé admin invalide.'); throw new Error('unauthorized'); }
  if(!res.ok){ showToast('Erreur serveur (' + res.status + ').'); throw new Error('http ' + res.status); }
  return res.json();
}

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function rowHtml(p){
  return `
    <div class="row" data-id="${p.id}">
      <div class="row-head">
        <span class="ref">${escapeHtml(p.reference)}</span>
        <span class="meta">${escapeHtml(p.user_email)}</span>
      </div>
      <div class="meta">${escapeHtml(p.subject)} · niveau ${escapeHtml(p.level)} · ${escapeHtml(p.billing_cycle)} · demandé le ${p.created_at ? new Date(p.created_at).toLocaleDateString('fr-FR') : '?'}</div>
      <div class="row-actions">
        <input type="number" step="0.1" placeholder="Montant (TND)" class="amount">
        <button class="btn-confirm">✅ Confirmer le virement reçu</button>
      </div>
    </div>
  `;
}

async function loadPayments(){
  const rows = await callApi('/api/admin/payments/pending');
  document.getElementById('summary').innerHTML = `<b>${rows.length}</b> virement(s) en attente de confirmation`;

  const container = document.getElementById('rows');
  if(!rows.length){
    container.innerHTML = '<p class="empty">Rien en attente.</p>';
    return;
  }
  container.innerHTML = rows.map(rowHtml).join('');

  container.querySelectorAll('.row').forEach(el => {
    const id = el.dataset.id;
    el.querySelector('.btn-confirm').addEventListener('click', async (ev) => {
      ev.target.disabled = true;
      const amountVal = el.querySelector('.amount').value;
      try {
        await callApi(`/api/admin/payments/${id}/verify`, {
          method: 'POST',
          body: JSON.stringify({amount_tnd: amountVal ? Number(amountVal) : null}),
        });
        showToast('Virement confirmé — accès débloqué.');
        el.remove();
      } catch { ev.target.disabled = false; }
    });
  });
}

document.getElementById('saveKey').addEventListener('click', () => {
  localStorage.setItem('smartprof_payments_admin_key', keyInput.value);
  loadPayments().catch(() => {});
});

if(keyInput.value) loadPayments().catch(() => {});
</script>
</body>
</html>
