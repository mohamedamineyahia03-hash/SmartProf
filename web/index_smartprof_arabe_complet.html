<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartProf — Apprendre, niveau par niveau</title>
<meta name="description" content="Apprentissage personnalisé pour le primaire tunisien, suivi pour toute la fratrie, en arabe, français et anglais.">
<!-- og:image à ajouter dès qu'une URL d'hébergement définitive existe (voir web/assets/og-image.png généré localement) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="SmartProf">
<meta property="og:title" content="SmartProf — Apprendre, niveau par niveau">
<meta property="og:description" content="Apprentissage personnalisé pour le primaire tunisien, suivi pour toute la fratrie, en arabe, français et anglais.">
<meta property="og:locale" content="fr_FR">
<meta property="og:locale:alternate" content="ar_TN">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1B2340">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2340;
    --paper:#FFF3EC;
    --paper-soft:#FFE3EE;
    --card:#FFFFFF;
    --muted:#6B7280;
    --accent:#FF3D77;
    --accent-2:#FFC93C;
    --glow: rgba(255,61,119,.5);
    --radius: 34px;
    --deco-opacity: 1;
    --title-size: clamp(2.3rem, 6vw, 3.6rem);
    --stage-size: 210px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; min-height:100vh;
    font-family:'Inter', sans-serif;
    color:var(--ink); background:var(--paper);
    transition:background .6s ease; overflow-x:hidden;
  }
  h1,h2,h3,.brand{font-family:'Baloo 2', sans-serif;}

  .bg-deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;opacity:var(--deco-opacity);transition:opacity .5s ease;}
  .bg-deco .spark{position:absolute;animation:sparkfloat 7s ease-in-out infinite;filter:drop-shadow(0 0 6px var(--glow));transition:filter 1s ease;}
  .bg-deco .spark svg{width:100%;height:100%;animation:twinkle 2.4s ease-in-out infinite;transform-origin:center;}
  @keyframes sparkfloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-18px);}}
  @keyframes twinkle{0%,100%{opacity:.35;transform:scale(.75) rotate(0deg);}50%{opacity:.9;transform:scale(1.05) rotate(18deg);}}

  .wrap{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:32px 20px 80px;}

  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:30px;}
  .brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.4rem;}
  .brand .logo-badge{width:54px;height:54px;flex-shrink:0;filter:drop-shadow(0 4px 8px rgba(27,35,64,.25)) drop-shadow(0 0 10px var(--glow));transition:filter 1s ease;}
  .lang-toggle{display:flex;gap:6px;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 4px 16px rgba(27,35,64,.08);}
  .lang-toggle button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-family:'Inter',sans-serif;font-weight:600;font-size:.85rem;cursor:pointer;color:var(--muted);transition:all .3s ease;}
  .lang-toggle button.active{background:var(--ink);color:#fff;}

  .hero{text-align:center;margin-bottom:4px;position:relative;}
  .aura{
    position:absolute; left:50%; top:36px; transform:translateX(-50%);
    width:calc(var(--stage-size) * 1.7); height:calc(var(--stage-size) * 1.7);
    border-radius:50%;
    background:radial-gradient(circle, var(--accent) 0%, var(--accent-2) 40%, transparent 72%);
    filter:blur(28px);
    opacity:.4;
    animation:auraPulse 3.6s ease-in-out infinite;
    z-index:0;
    transition:width .5s ease, height .5s ease, background 1s ease;
  }
  .burst{
    position:absolute; left:50%; top:36px; transform:translateX(-50%);
    width:calc(var(--stage-size) * 2.3); height:calc(var(--stage-size) * 2.3);
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--accent), transparent 18%, var(--accent-2), transparent 40%, var(--accent), transparent 62%, var(--accent-2), transparent 84%, var(--accent));
    opacity:.16;
    filter:blur(3px);
    animation:burstSpin 16s linear infinite;
    z-index:0;
    transition:background 1s ease;
  }
  @keyframes burstSpin{to{transform:translateX(-50%) rotate(360deg);}}
  @keyframes auraPulse{0%,100%{opacity:.32; transform:translateX(-50%) scale(1);}50%{opacity:.5; transform:translateX(-50%) scale(1.07);}}
  .mascot-stage{
    position:relative; z-index:1;
    width:var(--stage-size); height:var(--stage-size);
    margin:0 auto 4px;
    transition:width .5s ease, height .5s ease;
    filter:drop-shadow(0 10px 16px rgba(27,35,64,.18)) drop-shadow(0 0 26px var(--glow));
  }
  .mascot-stage svg{width:100%;height:100%;overflow:visible;}
  .mascot-stage.pop{animation:popIn .6s cubic-bezier(.34,1.56,.64,1);}
  @keyframes popIn{0%{transform:scale(.3) translateY(20px);opacity:0;}100%{transform:scale(1) translateY(0);opacity:1;}}
  .hero h1{position:relative;z-index:1;font-size:var(--title-size);line-height:1.06;margin:6px 0 0;transition:font-size .5s ease;}
  .hero h1.pop{animation:titlePop .55s ease .1s both;}
  .hero-tagline{position:relative;z-index:1;font-family:'Inter',sans-serif;font-weight:600;font-size:.95rem;color:var(--muted);margin:10px 0 0;}
  @keyframes titlePop{0%{transform:translateY(14px);opacity:0;}100%{transform:translateY(0);opacity:1;}}

  .m-body{animation:bob 3.2s ease-in-out infinite;transform-origin:center bottom;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
  .m-blink{animation:blink 4.5s ease-in-out infinite;transform-origin:center;}
  @keyframes blink{0%,92%,100%{transform:scaleY(1);}94%,97%{transform:scaleY(.12);}}
  .m-sparkle{animation:twk 1.8s ease-in-out infinite;transform-origin:center;}
  @keyframes twk{0%,100%{opacity:.3;transform:scale(.7) rotate(0deg);}50%{opacity:1;transform:scale(1.15) rotate(20deg);}}
  .m-float{animation:floaty2 3.6s ease-in-out infinite;}
  @keyframes floaty2{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .m-glow{animation:glow 2.6s ease-in-out infinite;}
  @keyframes glow{0%,100%{opacity:.55;}50%{opacity:1;}}
  .m-flame{animation:flame .5s ease-in-out infinite alternate;transform-origin:center top;}
  @keyframes flame{0%{transform:scaleY(1) scaleX(1);}100%{transform:scaleY(1.25) scaleX(.85);}}
  .m-wag{animation:wag 2.2s ease-in-out infinite;transform-origin:top center;}
  @keyframes wag{0%,100%{transform:rotate(-5deg);}50%{transform:rotate(9deg);}}

  .level-path{display:flex;align-items:center;justify-content:center;gap:6px;margin:38px 0 40px;flex-wrap:wrap;}
  .level-step{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .level-step button{position:relative;z-index:2;width:56px;height:56px;border-radius:50%;border:3px solid var(--card);background:var(--card);box-shadow:0 4px 14px rgba(27,35,64,.1);font-family:'Baloo 2', sans-serif;font-weight:700;font-size:1.2rem;color:var(--muted);cursor:pointer;transition:all .35s ease;}
  .level-step button.active{background:linear-gradient(135deg, var(--accent), var(--accent-2));color:#fff;border-color:var(--accent);transform:scale(1.14);box-shadow:0 8px 20px rgba(255,61,119,.35);}
  .level-step span{font-size:.72rem;font-weight:600;color:var(--muted);text-align:center;max-width:74px;}
  .level-connector{position:relative;z-index:1;width:28px;height:3px;background:var(--card);border-radius:3px;margin-top:-28px;pointer-events:none;}

  .subjects{display:grid;grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));gap:16px;margin-bottom:40px;}
  .subject-card{position:relative;background:var(--card);border-radius:var(--radius);padding:20px 14px;text-align:center;border:2px solid transparent;box-shadow:0 4px 18px rgba(27,35,64,.06);transition:all .35s ease;}
  .subject-card:hover{border-color:var(--accent);transform:translateY(-4px);}
  .subject-card.locked{opacity:.75;}
  .subject-card.trial{border-color:var(--accent-2);}
  .trial-note{display:block;font-size:.7rem;font-weight:700;color:var(--accent);background:var(--paper-soft);border-radius:999px;padding:2px 10px;margin:-4px 0 8px;}
  .subject-card.trial .start-btn{background:linear-gradient(135deg, var(--accent), var(--accent-2));}
  .subject-card .icon-wrap{width:72px;height:72px;margin:0 auto 8px;filter:drop-shadow(0 6px 8px rgba(27,35,64,.15)) drop-shadow(0 0 12px var(--glow));transition:filter 1s ease;}
  .subject-card .icon-wrap svg{width:100%;height:100%;overflow:visible;}
  .subject-card .name{font-weight:600;font-size:.95rem;display:block;margin-bottom:10px;}
  .icon-anim{animation:iconbounce 2.6s ease-in-out infinite;transform-origin:center bottom;}
  @keyframes iconbounce{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-4px) rotate(-3deg);}}

  .start-btn{border:0;background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-family:'Inter',sans-serif;font-weight:600;font-size:.78rem;cursor:pointer;transition:transform .2s ease;}
  .start-btn:hover{transform:translateY(-2px);}
  .subject-card.locked .start-btn{background:var(--muted);}

  .session-view{display:none;}
  .session-view.active{display:block;}
  .session-card{background:var(--card);border-radius:var(--radius);padding:30px 26px;box-shadow:0 4px 20px rgba(27,35,64,.08);margin-bottom:24px;}
  .session-progress{font-weight:600;color:var(--muted);margin-bottom:14px;font-size:.85rem;}
  .session-question{font-size:1.25rem;font-weight:700;margin-bottom:22px;}
  .session-visual{font-size:2.6rem;text-align:center;margin:-6px 0 22px;letter-spacing:.15em;}
  .visual-icon{display:inline-block;width:44px;height:44px;vertical-align:middle;margin:2px;filter:drop-shadow(0 3px 5px rgba(27,35,64,.15));}
  .visual-icon svg{width:100%;height:100%;overflow:visible;}
  .choice-list{display:grid;gap:12px;margin-bottom:20px;}
  .choice-btn{padding:16px;border-radius:14px;border:2px solid #e5e7eb;background:#fff;font-family:'Inter',sans-serif;font-size:1.15rem;font-weight:600;color:var(--ink);cursor:pointer;text-align:center;transition:all .2s ease;}
  .choice-btn:hover{border-color:var(--accent);}
  .choice-btn.selected{border-color:var(--accent);background:var(--paper-soft);}
  .choice-btn:disabled{cursor:default;}
  .answer-input{width:100%;padding:14px;border-radius:10px;border:2px solid #e5e7eb;font-size:1rem;margin-bottom:20px;font-family:'Inter',sans-serif;}
  .session-actions{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;}
  .session-actions button{border:0;border-radius:999px;padding:12px 24px;font-family:'Baloo 2',sans-serif;font-weight:700;cursor:pointer;}
  .btn-primary{background:linear-gradient(135deg, var(--accent), var(--accent-2));color:#fff;}
  .btn-primary:disabled{opacity:.5;cursor:default;}
  .btn-secondary{background:#eee;color:var(--ink);}
  .feedback-banner{padding:14px 18px;border-radius:12px;margin-bottom:18px;font-weight:600;}
  .feedback-banner.correct{background:#DCFCE7;color:#166534;}
  .feedback-banner.incorrect{background:#FEE2E2;color:#991B1B;}
  .feedback-explain{margin:8px 0 0;font-weight:500;font-size:.92rem;line-height:1.5;opacity:.92;}
  .recit-context{background:var(--paper-soft, #f4f4f6);border-radius:14px;padding:16px 18px;margin-bottom:24px;font-size:1.05rem;line-height:1.5;}
  .sub-question-block{margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid #eef0f4;}
  .sub-question-block:last-of-type{border-bottom:none;margin-bottom:20px;}
  .sub-question-label{font-weight:700;font-size:1.02rem;margin-bottom:12px;}
  .sub-question-feedback{margin-top:10px;}
  .session-summary{text-align:center;}
  .session-summary .score-big{font-size:3rem;font-weight:800;font-family:'Baloo 2',sans-serif;margin:10px 0;}

  .tree-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tree-tab{padding:10px 18px;border-radius:999px;border:2px solid transparent;background:var(--paper-soft);color:var(--ink);font-weight:600;font-size:.9rem;cursor:pointer;transition:all .2s ease;}
  .tree-tab.active{background:linear-gradient(135deg, var(--accent), var(--accent-2));color:#fff;}
  .tree-tab.locked{background:transparent;border-color:#e5e7eb;color:var(--muted);opacity:.75;cursor:not-allowed;}
  .tree-tab.locked:hover{border-color:#e5e7eb;}
  .section-list{display:grid;grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));gap:12px;margin-bottom:8px;}
  .section-card{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-radius:16px;border:2px solid transparent;background:var(--card);box-shadow:0 3px 12px rgba(27,35,64,.07);cursor:pointer;text-align:start;font-family:inherit;transition:all .2s ease;}
  .section-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .section-card .section-name{font-weight:700;font-size:.98rem;}
  .section-card .section-count{flex:none;background:var(--paper-soft);color:var(--muted);font-weight:700;font-size:.75rem;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .expression-block{margin-top:22px;padding-top:20px;border-top:1px solid #eef0f4;}
  .expression-title{font-weight:700;font-size:.9rem;color:var(--muted);margin-bottom:12px;}
  .section-card.expression{background:var(--paper-soft);}

  .corrige-list{text-align:start;margin:22px 0;}
  .corrige-item{padding:16px 0;border-bottom:1px solid #eef0f4;}
  .corrige-item:last-child{border-bottom:none;}
  .corrige-q{font-weight:700;font-size:.98rem;}
  .corrige-badge{display:inline-block;margin-inline-end:8px;}
  .corrige-badge.open{opacity:.85;}
  .corrige-answer{margin-top:6px;font-weight:600;font-size:.9rem;color:#991B1B;}
  .corrige-answer.model{color:var(--muted);}
  .corrige-explain{margin-top:4px;font-size:.88rem;line-height:1.5;color:var(--muted);}
  .corrige-subitem{margin-top:10px;padding-inline-start:6px;}
  .corrige-poem{margin-top:8px;font-size:.88rem;line-height:1.6;color:var(--ink);white-space:normal;}
  .corrige-author{margin-top:4px;font-size:.8rem;color:var(--muted);}

  .tts-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:none;background:var(--paper-soft);cursor:pointer;font-size:1rem;vertical-align:middle;margin-inline-start:6px;transition:transform .15s ease;}
  .tts-btn:hover{transform:scale(1.08);}
  .tts-btn:active{transform:scale(.94);}
  .tts-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0;}
  .recitation-poem{background:var(--paper-soft, #f4f4f6);border-radius:14px;padding:18px 20px;margin-bottom:18px;font-size:1.1rem;line-height:1.7;font-family:'Baloo 2', sans-serif;}
  .recitation-author{margin-top:10px;font-size:.85rem;color:var(--muted);font-style:italic;}
  .oral-hint{margin-top:2px;font-size:.82rem;}
  .answer-textarea{width:100%;padding:14px;border-radius:10px;border:2px solid #e5e7eb;font-size:1rem;margin-bottom:20px;font-family:'Inter',sans-serif;resize:vertical;}
  #recordPlayback{max-width:100%;height:36px;}

  .locked-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 22px;border-radius:999px;font-weight:600;font-size:.85rem;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:50;opacity:0;pointer-events:none;transition:opacity .3s ease;max-width:90vw;text-align:center;}
  .locked-toast.show{opacity:1;}

  .header-actions{display:flex;align-items:center;gap:10px;}
  .parent-btn{border:0;background:var(--card);color:var(--ink);padding:9px 16px;border-radius:999px;font-family:'Inter',sans-serif;font-weight:600;font-size:.82rem;cursor:pointer;box-shadow:0 4px 16px rgba(27,35,64,.08);transition:transform .2s ease;}
  .parent-btn:hover{transform:translateY(-2px);}
  .child-badge{border:0;background:linear-gradient(135deg, var(--accent), var(--accent-2));color:#fff;padding:9px 16px;border-radius:999px;font-family:'Inter',sans-serif;font-weight:700;font-size:.82rem;cursor:pointer;box-shadow:0 4px 16px rgba(255,61,119,.25);transition:transform .2s ease;}
  .child-badge:hover{transform:translateY(-2px);}

  .parent-tabs{display:flex;gap:8px;margin-bottom:20px;}
  .parent-tab{flex:1;border:0;background:#f1f1f1;color:var(--muted);padding:10px;border-radius:999px;font-family:'Inter',sans-serif;font-weight:600;font-size:.85rem;cursor:pointer;transition:all .2s ease;}
  .parent-tab.active{background:var(--ink);color:#fff;}
  .form-label{display:block;font-weight:600;font-size:.82rem;color:var(--muted);margin:14px 0 6px;}
  .form-error{color:#991B1B;font-size:.85rem;font-weight:600;min-height:1.2em;margin-top:6px;}
  select.answer-input{cursor:pointer;}
  .parent-account-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;font-weight:600;flex-wrap:wrap;gap:10px;}
  .parent-section-title{font-size:1rem;margin:18px 0 10px;}
  .children-list{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .child-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;background:var(--paper-soft);border-radius:12px;font-weight:600;}
  .child-level{color:var(--muted);font-weight:500;}
  .referral-row{display:flex;gap:8px;margin-bottom:6px;}
  .referral-row .answer-input{flex:1;min-width:0;font-size:.82rem;color:var(--muted);}
  .referral-row .btn-secondary{flex-shrink:0;white-space:nowrap;}
  .muted-note{font-size:.82rem;color:var(--muted);margin:6px 0 0;}
  .skill-badges{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px;}
  .skill-badge{padding:6px 14px;border-radius:999px;font-size:.8rem;font-weight:600;}
  .skill-badge.good{background:#DCFCE7;color:#166534;}
  .skill-badge.weak{background:#FEE2E2;color:#991B1B;}

  .supervision-header{display:flex;align-items:center;gap:14px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid #ececec;}
  .supervision-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg, var(--accent), var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0;}
  .supervision-name{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1.2rem;}
  .supervision-status{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);margin-top:2px;}
  .status-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0;}
  .stat-grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:12px;margin-bottom:24px;}
  .stat-tile{background:var(--paper-soft);border-radius:16px;padding:16px;text-align:center;}
  .stat-icon{font-size:1.3rem;margin-bottom:4px;}
  .stat-value{font-family:'Baloo 2',sans-serif;font-size:1.6rem;font-weight:800;}
  .stat-label{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .supervision-section{margin-bottom:20px;}
  .supervision-section-title{font-weight:700;font-size:.9rem;margin-bottom:10px;}
  .supervision-log{display:flex;flex-direction:column;gap:6px;}
  .supervision-log-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:#fafafa;border-radius:10px;font-size:.88rem;}
  .supervision-log-score{font-weight:700;}

  .level-panel{background:var(--paper-soft);border-radius:var(--radius);padding:28px 26px;margin-bottom:40px;transition:background .6s ease, border-radius .5s ease;}
  .level-panel h2{margin:0 0 8px;font-size:1.4rem;}
  .level-panel p{margin:0;color:var(--muted);line-height:1.5;}
  .level-panel .tag{display:inline-block;background:var(--accent);color:#fff;font-weight:600;font-size:.75rem;padding:5px 12px;border-radius:999px;margin-bottom:12px;}

  .download{text-align:center;background:var(--card);border-radius:var(--radius);padding:34px 24px;box-shadow:0 4px 20px rgba(27,35,64,.07);}
  .download h2{font-size:1.3rem;margin:0 0 8px;}
  .download p{color:var(--muted);margin:0 0 20px;}
  .download-btn{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg, var(--accent), var(--accent-2));color:#fff;border:0;padding:16px 30px;border-radius:999px;font-family:'Baloo 2', sans-serif;font-weight:700;font-size:1.05rem;cursor:pointer;box-shadow:0 8px 22px var(--glow);transition:transform .25s ease, box-shadow 1s ease;}
  .download-btn:hover{transform:translateY(-2px);}
  .download-btn svg{width:18px;height:18px;}
  .download-note{margin-top:14px;font-size:.8rem;color:var(--muted);}

  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:40px;}

  @media (prefers-reduced-motion: reduce){
    .bg-deco .spark svg,.m-body,.m-blink,.m-sparkle,.m-float,.m-glow,.m-flame,.m-wag,.icon-anim,.aura,.mascot-stage.pop,.hero h1.pop{animation:none !important;}
  }

  /* ---------- Passe desktop ---------- */
  /* Jusqu'ici tout empilait verticalement dans une colonne centrée à 920px,
     même sur un écran large — correct sur mobile, mais ça n'utilisait rien
     de l'espace en plus sur ordinateur. À partir de 900px : mascotte/niveau
     d'un côté, matières à essayer vraiment de l'autre, côte à côte plutôt
     qu'empilées — même contenu, composition qui change avec la largeur. */
  @media (min-width: 900px){
    .wrap{max-width:1180px;}
    #homeView{display:grid;grid-template-columns:.85fr 1.15fr;gap:48px;align-items:start;}
    .subjects{grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));}
    .session-card{max-width:760px;margin-left:auto;margin-right:auto;}

function lgrad(id, c1, c2, angle){

}
function shine(cx,cy,rx,ry,rot){
  return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#fff" opacity=".55" transform="rotate(${rot||0} ${cx} ${cy})"/>`;
}
function shadowEllipse(cx,cy,rx,ry){
  return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#000" opacity=".1"/>`;
}
function eyesFace(cx1, cx2, cy, r, pupil){
  return `

// Remplace chaque emoji connu de content.visual par son icône SVG cartoon ;
// un emoji non répertorié (ou tout autre caractère, "<br>" inclus) reste
// affiché tel quel.
function renderVisual(text){
  if(!text) return '';
  let out = '';
  for(const ch of text){
    const iconFn = VISUAL_ICON_MAP[ch];
    out += iconFn ? `<span class="visual-icon">${iconFn()}</span>` : ch;
  }
  return out;
}

// Mélange l'ordre d'affichage des choix (Fisher-Yates) — le contenu place
// souvent la bonne réponse en premier, sans quoi un enfant pourrait
// apprendre à toujours cliquer la première option au lieu de lire.
// data-choice porte toujours le texte exact, donc la correction ne dépend
// jamais de l'ordre.
function shuffled(array){
  const a = array.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  return !subject.freeLevels.includes(String(level));
}

function formatRelativeTime(isoString){
  if(!isoString) return null;
  const date = new Date(isoString.endsWith('Z') ? isoString : isoString + 'Z');
  const diffMin = Math.floor((Date.now() - date.getTime()) / 60000);
  const diffH = Math.floor(diffMin / 60);
  const diffDays = Math.floor(diffH / 24);

  if(diffMin < 1) return currentLang === 'ar' ? "الآن" : "à l'instant";
  if(diffMin < 60) return currentLang === 'ar' ? `منذ ${diffMin} دقيقة` : `il y a ${diffMin} min`;
  if(diffH < 24) return currentLang === 'ar' ? `منذ ${diffH} ساعة` : `il y a ${diffH} h`;
  if(diffDays === 1) return currentLang === 'ar' ? "أمس" : "hier";
  if(diffDays < 7) return currentLang === 'ar' ? `منذ ${diffDays} أيام` : `il y a ${diffDays} jours`;
  return date.toLocaleDateString(currentLang === 'ar' ? 'ar-TN' : 'fr-FR');
}

  e.preventDefault();

});

  if (deferredInstallPrompt) {
    const promptEvent = deferredInstallPrompt;

      document.getElementById('downloadStatus').textContent =
        choice.outcome === 'accepted' ? TEXT.downloadInstalled[currentLang] : '';
    } catch(e){ /* choix non disponible sur ce navigateur — rien à afficher */ }
    return;
  }
  document.getElementById('downloadStatus').textContent = TEXT.downloadStatus[currentLang];
});

// sections indépendantes comme Expression orale et écrite) — cliquer une
// section démarre la session-examen correspondante (startExamSession).
async function openSectionTree(subjectId){
  let data;
  try {
    const res = await fetch('/api/skills');
    data = await res.json();
  } catch(e){
    showLockedToast(TEXT.genericError[currentLang]);
    return;
  }

  const tree = ((data.levels[String(currentLevel)] || {})[subjectId]) || {programme:{}, expression:[]};
  const currentTrimester = data.current_trimester || 'T1';
  currentTree = {subjectId, tree, currentTrimester, trimesterStarts: data.trimester_starts || {}};

  const defaultTrimester = TRIMESTER_ORDER.find(t => !isTrimesterLocked(t) && (tree.programme[t] || []).length) || currentTrimester;
  currentTree.trimester = defaultTrimester;

  document.getElementById('homeView').style.display = 'none';
  document.getElementById('sessionView').classList.add('active');
  renderSectionTree();
}

            <span class="section-name">${currentLang === 'ar' ? sec.name_ar : sec.name_fr}</span>

  view.innerHTML = `

      <div class="session-actions">

async function startExamSession(subjectId, domainCode, trimester){
  let res, data;
  try {
    res = await fetch('/api/session/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        level: currentLevel, subject: subjectId, domain: domainCode, trimester,
        child_id: activeChild ? activeChild.id : undefined
      })
    });
    data = await res.json();
  } catch(e){
    showLockedToast(TEXT.genericError[currentLang]);
    return;
  }

  if(res.status === 403){ showLockedToast(TEXT.lockedMessage[currentLang]); return; }
  if(res.status === 404){ showLockedToast(TEXT.noContentMessage[currentLang]); return; }
  if(!res.ok){ showLockedToast(TEXT.genericError[currentLang]); return; }

  currentSession = {sessionId: data.session_id, exercises: data.exercises, index: 0, subjectId, level: currentLevel};
  renderSessionQuestion();
}

// L'interface reste toujours en arabe (pas de sélecteur de langue), mais le
// contenu d'un exercice de Français/Anglais est écrit entièrement dans sa
// propre langue — il a donc besoin de son propre sens de lecture (LTR),
// indépendant du sens RTL de l'interface autour de lui.
function dirFor(language){
  return language === 'ar' ? 'rtl' : 'ltr';
}

/* ---- Lecture à voix haute (Web Speech API) ----
   Gratuit, aucun serveur : la voix exacte dépend de l'appareil/navigateur
   de l'élève (SAPI sur Windows, voix système sur mobile...). On essaie une
   voix féminine connue par son nom, sinon la première voix disponible dans
   la bonne langue, jamais une voix d'une autre langue. Si aucune voix n'est
   installée sur l'appareil, le bouton 🔊 le dit au lieu de rester muet sans
   explication — un bouton qui "ne fait rien" en silence se lit comme cassé. */
function ttsLangCode(language){
  return {fr:'fr-FR', en:'en-US', ar:'ar-SA'}[language] || 'fr-FR';
}
const FEMALE_VOICE_HINTS = ['female', 'zira', 'hortense', 'julie', 'amelie', 'amélie', 'audrey', 'samantha', 'salma', 'laila', 'fatima'];
function pickVoice(langCode){
  if(!(window.speechSynthesis)) return null;
  const voices = window.speechSynthesis.getVoices();
  const prefix = langCode.slice(0,2).toLowerCase();
  const matching = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
  if(!matching.length) return null;
  const female = matching.find(v => FEMALE_VOICE_HINTS.some(hint => v.name.toLowerCase().includes(hint)));
  return female || matching[0];
}

// speechSynthesis.getVoices() renvoie souvent un tableau vide au tout
// premier appel (chargement asynchrone par le navigateur) — on attend
// l'évènement voiceschanged une fois avant d'abandonner (max 1s).
let voicesReadyPromise = null;
function waitForVoices(){
  if(!(window.speechSynthesis)) return Promise.resolve([]);
  const existing = window.speechSynthesis.getVoices();
  if(existing.length) return Promise.resolve(existing);
  if(voicesReadyPromise) return voicesReadyPromise;
  voicesReadyPromise = new Promise(resolve => {
    const timer = setTimeout(() => resolve(window.speechSynthesis.getVoices()), 1000);
    window.speechSynthesis.addEventListener('voiceschanged', () => {
      clearTimeout(timer);
      resolve(window.speechSynthesis.getVoices());
    }, {once: true});
  });
  return voicesReadyPromise;
}

function speakUtterance(text, language){
  return new Promise(resolve => {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = ttsLangCode(language);
    const voice = pickVoice(utterance.lang);
    if(voice) utterance.voice = voice;
    utterance.rate = 0.9; // légèrement ralenti, pensé pour un enfant qui apprend à prononcer
    utterance.onend = () => resolve(true);
    utterance.onerror = () => resolve(false);
    window.speechSynthesis.speak(utterance);
  });
}

// Lit un texte à voix haute. Affiche un message si la synthèse vocale
// n'est pas disponible sur cet appareil plutôt que de rester silencieux.
async function speakText(text, language){
  if(!(window.speechSynthesis) || !text){
    showLockedToast(TEXT.ttsUnavailableMessage[currentLang]);
    return;
  }
  window.speechSynthesis.cancel();
  await waitForVoices();
  const ok = await speakUtterance(text, language);
  if(!ok) showLockedToast(TEXT.ttsUnavailableMessage[currentLang]);
}

// Lecture "au rythme" pour la récitation : un vers à la fois avec une
// courte pause entre chaque, plus proche du phrasé d'une récitation que de
// lire tout le poème d'une traite.
async function speakLines(text, language){
  if(!(window.speechSynthesis) || !text){
    showLockedToast(TEXT.ttsUnavailableMessage[currentLang]);
    return;
  }
  window.speechSynthesis.cancel();
  await waitForVoices();
  const lines = text.split('\n').filter(l => l.trim());
  let anySucceeded = false;
  for(const line of lines){
    const ok = await speakUtterance(line, language);
    anySucceeded = anySucceeded || ok;
    if(!ok) break;
    await new Promise(r => setTimeout(r, 350)); // pause entre les vers
  }
  if(!anySucceeded) showLockedToast(TEXT.ttsUnavailableMessage[currentLang]);
}

function ttsButtonHtml(){
  return `<button type="button" class="tts-btn" id="ttsBtn" title="${TEXT.listenLabel[currentLang]}">🔊</button>`;
}

/* ---- Auto-enregistrement (micro navigateur) ----
   Entraînement libre pour l'expression orale et la récitation : l'élève
   s'enregistre et se réécoute localement, rien n'est envoyé au serveur,
   rien n'est noté. */
let activeRecorder = null;
function recordControlsHtml(){
  return `
    <button type="button" class="btn-secondary" id="recordBtn">${TEXT.recordLabel[currentLang]}</button>
    <audio id="recordPlayback" controls style="display:none;"></audio>
  `;
}
function wireRecordControls(view){
  const recordBtn = view.querySelector('#recordBtn');
  const playback = view.querySelector('#recordPlayback');
  if(!recordBtn) return;
  if(!(navigator.mediaDevices && window.MediaRecorder)){
    recordBtn.disabled = true;
    return;
  }
  let recording = false;
  let chunks = [];
  recordBtn.addEventListener('click', async () => {
    if(!recording){
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({audio: true});
      } catch(e){
        showLockedToast(TEXT.micErrorMessage[currentLang]);
        return;
      }
      chunks = [];
      activeRecorder = new MediaRecorder(stream);
      activeRecorder.addEventListener('dataavailable', e => { if(e.data.size > 0) chunks.push(e.data); });
      activeRecorder.addEventListener('stop', () => {
        const blob = new Blob(chunks, {type: 'audio/webm'});
        playback.src = URL.createObjectURL(blob);
        playback.style.display = '';
        stream.getTracks().forEach(t => t.stop());
      });
      activeRecorder.start();
      recording = true;
      recordBtn.textContent = TEXT.stopRecordLabel[currentLang];
    } else {
      activeRecorder.stop();
      recording = false;
      recordBtn.textContent = TEXT.recordLabel[currentLang];
    }
  });
}

// Session-examen : pas de corrigé immédiat après chaque question (voir
// GET .../corrige) — "Valider" enregistre la réponse et passe directement
// à la question suivante, comme dans un vrai examen sur papier.
function renderSessionQuestion(){
  const view = document.getElementById('sessionView');
  const ex = currentSession.exercises[currentSession.index];
  const content = ex.content;
  const isLast = currentSession.index === currentSession.exercises.length - 1;

  if(ex.format === 'recitation'){
    renderRecitationExercise(view, ex, content, isLast);
    return;
  }
  // grading_mode "open" = production écrite (pas de réponse exacte à
  // vérifier) : toujours une réponse tapée, jamais orale — voir le
  // commentaire en tête de seed_expression_recitation.py.
  if(ex.grading_mode === 'open'){
    renderWrittenExpressionExercise(view, ex, content, isLast);
    return;
  }
  if(content.sub_questions){
    renderMultiQuestionExercise(view, ex, content, isLast);
    return;
  }

  const answerArea = content.choices
    ? `<div class="choice-list" id="choiceList">${shuffled(content.choices).map(c => `<button type="button" class="choice-btn" data-choice="${String(c).replace(/"/g,'&quot;')}">${renderVisual(c)}</button>`).join('')}</div>`
    : `<input type="text" class="answer-input" id="answerInput" placeholder="${TEXT.answerPlaceholder[currentLang]}">`;

  const visualArea = content.visual ? `<div class="session-visual">${renderVisual(content.visual)}</div>` : '';

  view.innerHTML = `
    <div class="session-card">
      <div class="session-progress">${exerciseProgressText(currentSession.index + 1, currentSession.exercises.length)}</div>
      <div class="exercise-content" dir="${dirFor(ex.language)}">
        <div class="session-question">${content.question} ${ttsButtonHtml()}</div>
        ${visualArea}
        ${answerArea}
      </div>
      <div class="session-actions">
        <button type="button" class="btn-secondary" id="backHomeBtn">${TEXT.backHome[currentLang]}</button>
        <button type="button" class="btn-primary" id="validateBtn">${isLast ? TEXT.finish[currentLang] : TEXT.validate[currentLang]}</button>
      </div>
    </div>
  `;

  document.getElementById('backHomeBtn').addEventListener('click', backToHome);
  document.getElementById('ttsBtn').addEventListener('click', () => speakText(content.question, ex.language));
  const validateBtn = document.getElementById('validateBtn');

  // Disables everything synchronously, before the async submitAnswer() call
  // even starts — closes the window where a fast double-click/double-tap on
  // "Valider" could fire two submissions for the same exercise.
  function lockAndSubmit(value){
    validateBtn.disabled = true;
    view.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
    const input = document.getElementById('answerInput');
    if(input) input.disabled = true;
    submitAnswer(value);
  }

  if(content.choices){
    let selected = null;
    view.querySelectorAll('.choice-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        view.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selected = btn.dataset.choice;
      });
    });
    validateBtn.addEventListener('click', () => { if(selected !== null) lockAndSubmit(selected); });
  } else {
    validateBtn.addEventListener('click', () => {
      const val = document.getElementById('answerInput').value.trim();
      if(val) lockAndSubmit(val);
    });
  }
}

// Section Récitation : lecture-modèle (TTS) + auto-enregistrement pour se
// réécouter — entraînement libre, jamais noté (voir grading_mode "open").
function renderRecitationExercise(view, ex, content, isLast){
  const poemHtml = (content.text || '').split('\n').map(line => line || '&nbsp;').join('<br>');

  view.innerHTML = `
    <div class="session-card">
      <div class="session-progress">${exerciseProgressText(currentSession.index + 1, currentSession.exercises.length)}</div>
      <div class="exercise-content" dir="${dirFor(ex.language)}">
        <div class="session-question">${content.question}</div>
        <div class="recitation-poem">
          ${poemHtml}
          ${content.author ? `<div class="recitation-author">— ${content.author}</div>` : ''}
        </div>
        <p class="muted-note oral-hint">${TEXT.recitationHint[currentLang]}</p>
        <div class="tts-row">
          <button type="button" class="btn-secondary" id="listenBtn">${TEXT.listenLabel[currentLang]}</button>
          ${recordControlsHtml()}
        </div>
      </div>
      <div class="session-actions">
        <button type="button" class="btn-secondary" id="backHomeBtn">${TEXT.backHome[currentLang]}</button>
        <button type="button" class="btn-primary" id="validateBtn">${isLast ? TEXT.finish[currentLang] : TEXT.next[currentLang]}</button>
      </div>
    </div>
  `;

  document.getElementById('backHomeBtn').addEventListener('click', backToHome);
  document.getElementById('listenBtn').addEventListener('click', () => speakLines(content.text, ex.language));
  wireRecordControls(view);
  document.getElementById('validateBtn').addEventListener('click', () => {
    document.getElementById('validateBtn').disabled = true;
    submitAnswer(null);
  });
}

// Production écrite : réponse libre tapée, enregistrée en
// grading_mode "open" (jamais notée exactement, réponse-modèle affichée au
// corrigé comme repère).
function renderWrittenExpressionExercise(view, ex, content, isLast){
  const visualArea = content.visual ? `<div class="session-visual">${renderVisual(content.visual)}</div>` : '';

  view.innerHTML = `
    <div class="session-card">

      </div>
      <div class="session-actions">

        <button type="button" class="btn-primary" id="validateBtn">${isLast ? TEXT.finish[currentLang] : TEXT.validate[currentLang]}</button>
      </div>
    </div>
  `;

  document.getElementById('backHomeBtn').addEventListener('click', backToHome);
  document.getElementById('ttsBtn').addEventListener('click', () => speakText(content.question, ex.language));
  const validateBtn = document.getElementById('validateBtn');
  const textarea = document.getElementById('answerTextarea');
  validateBtn.addEventListener('click', () => {

}

function renderMultiQuestionExercise(view, ex, content, isLast){
  const subs = content.sub_questions;

  const blocksHtml = subs.map((sq, i) => {
    const answerArea = sq.choices
      ? `<div class="choice-list" id="choiceList-${i}">${shuffled(sq.choices).map(c => `<button type="button" class="choice-btn" data-choice="${String(c).replace(/"/g,'&quot;')}">${renderVisual(c)}</button>`).join('')}</div>`
      : `<input type="text" class="answer-input" id="answerInput-${i}" placeholder="${TEXT.answerPlaceholder[currentLang]}">`;
    return `
      <div class="sub-question-block" id="subq-${i}">
        <div class="sub-question-label">${i + 1}. ${sq.question}</div>
        ${answerArea}
      </div>`;
  }).join('');

  view.innerHTML = `
    <div class="session-card">
      <div class="session-progress">${exerciseProgressText(currentSession.index + 1, currentSession.exercises.length)}</div>
      <div class="exercise-content" dir="${dirFor(ex.language)}">
        <div class="recit-context">${content.question} ${ttsButtonHtml()}</div>
        ${blocksHtml}
      </div>
      <div class="session-actions">
        <button type="button" class="btn-secondary" id="backHomeBtn">${TEXT.backHome[currentLang]}</button>
        <button type="button" class="btn-primary" id="validateBtn">${isLast ? TEXT.finish[currentLang] : TEXT.validate[currentLang]}</button>
      </div>
    </div>
  `;

  document.getElementById('backHomeBtn').addEventListener('click', backToHome);
  document.getElementById('ttsBtn').addEventListener('click', () => speakText(content.question, ex.language));
  const validateBtn = document.getElementById('validateBtn');
  const selections = new Array(subs.length).fill(null);

  subs.forEach((sq, i) => {
    if(!sq.choices) return;
    view.querySelectorAll(`#subq-${i} .choice-btn`).forEach(btn => {
      btn.addEventListener('click', () => {
        view.querySelectorAll(`#subq-${i} .choice-btn`).forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selections[i] = btn.dataset.choice;
      });
    });
  });

  // Same synchronous-disable-before-async-submit pattern as the single-question
  // flow, applied to every sub-question's inputs at once.
  validateBtn.addEventListener('click', () => {
    const values = subs.map((sq, i) => sq.choices ? selections[i] : document.getElementById(`answerInput-${i}`).value.trim());
    if(values.some(v => v === null || v === '')) return;
    validateBtn.disabled = true;
    view.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
    view.querySelectorAll('.answer-input').forEach(inp => inp.disabled = true);
    submitAnswer(values);
  });
}

async function submitAnswer(answer){
  const ex = currentSession.exercises[currentSession.index];
  let res, data;
  try {
    res = await fetch(`/api/session/${currentSession.sessionId}/answer`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({exercise_id: ex.id, answer})
    });
    data = await res.json();
  } catch(e){
    // Network failure: re-enable so the child can retry instead of being
    // stuck on a permanently-disabled question.
    document.querySelectorAll('.choice-btn').forEach(b => b.disabled = false);
    document.querySelectorAll('.answer-input').forEach(inp => inp.disabled = false);
    const btn = document.getElementById('validateBtn');
    if(btn) btn.disabled = false;
    showLockedToast(TEXT.genericError[currentLang]);
    return;
  }

  if(!res.ok){
    // The session/exercise no longer matches what the server has (e.g. the
    // server was restarted mid-session).
    showLockedToast(TEXT.genericError[currentLang]);
    backToHome();
    return;
  }

  if(data.completed){
    renderSessionSummary();
  } else {
    currentSession.index += 1;
    renderSessionQuestion();
  }
}

function corrigeItemHtml(item, i){
  const questionLine = `<div class="corrige-q">${i + 1}. ${item.question || ''}</div>`;

  if(item.sub_results && item.sub_results.length){
    const subsHtml = item.sub_results.map(r => `
      <div class="corrige-subitem">
        <span class="corrige-badge">${r.correct ? '✅' : '❌'}</span>
        ${!r.correct ? `<span>${incorrectFeedbackText(r.correct_answer)}</span>` : ''}
        ${r.explanation ? `<div class="corrige-explain">${r.explanation}</div>` : ''}
      </div>`).join('');
    return `<div class="corrige-item">${questionLine}${subsHtml}</div>`;
  }

  if(!item.graded){
    const poemHtml = item.text ? `<div class="corrige-poem">${item.text.split('\n').join('<br>')}</div>` : '';
    const authorHtml = item.author ? `<div class="corrige-author">— ${item.author}</div>` : '';
    return `<div class="corrige-item">${questionLine}
      <span class="corrige-badge open">✍️</span>
      ${item.model_answer ? `<div class="corrige-answer model">${item.model_answer}</div>` : ''}
      ${poemHtml}${authorHtml}
    </div>`;
  }

  return `<div class="corrige-item">${questionLine}
    <span class="corrige-badge">${item.correct ? '✅' : '❌'}</span>
    ${!item.correct ? `<div class="corrige-answer">${incorrectFeedbackText(item.correct_answer)}</div>` : ''}
    ${item.explanation ? `<div class="corrige-explain">${item.explanation}</div>` : ''}
  </div>`;
}

// Génère une image carrée (1080×1080) reprenant l'identité visuelle de
// SmartProf (mascotte du niveau, couleurs, marque) à partir du résultat
// d'une séance, puis propose de la partager (feuille de partage native sur
// mobile — WhatsApp/Facebook/Messenger directement) ou la télécharge en
// repli. C'est le principal levier de bouche-à-oreille du produit : chaque
// séance réussie devient un contenu prêt à circuler dans les groupes de
// parents, sans rien demander de plus à l'utilisateur qu'un clic.
async function shareResultCard(score, total, subjectId, level){
  const lvl = LEVELS.find(l => l.id === level) || LEVELS[0];
  const subject = SUBJECTS.find(s => s.id === subjectId);
  const subjectName = subject ? subject.name[currentLang] : '';

  try { if(document.fonts && document.fonts.ready) await document.fonts.ready; } catch(e){}

  const canvas = document.createElement('canvas');
  canvas.width = 1080; canvas.height = 1080;
  const ctx = canvas.getContext('2d');
  // ctx.direction only ever set right before drawing actual Arabic text
  // below — applying it globally also flips plain numeric/Latin strings
  // like "12 / 15" into "15 / 12" (Canvas 2D direction has no real Unicode
  // bidi algorithm behind it, unlike CSS text).
  ctx.textAlign = 'center';

  const grad = ctx.createLinearGradient(0, 0, 1080, 1080);
  grad.addColorStop(0, lvl.paper || '#FFF3EC');
  grad.addColorStop(1, lvl.panel || '#FFE3EE');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1080, 1080);

  ctx.globalAlpha = .18;
  ctx.fillStyle = lvl.accent2;
  ctx.beginPath(); ctx.ellipse(130, 130, 220, 220, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(970, 960, 260, 260, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#1B2340';
  ctx.font = "700 60px 'Baloo 2', sans-serif";
  ctx.fillText('SmartProf', 540, 120);

  try {
    const mascotFn = MASCOTS[lvl.id];
    if(mascotFn){
      // MASCOTS() omits xmlns on purpose (it's normally injected via
      // innerHTML, where the HTML parser infers the SVG namespace) — but a
      // standalone <img> decoding an SVG data URI needs a well-formed
      // document, xmlns included, or the browser silently fails to decode it.
      const svg = mascotFn(lvl.accent, lvl.accent2).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
      const img = new Image();
      const loaded = new Promise((resolve) => { img.onload = resolve; img.onerror = resolve; });
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      await loaded;
      if(img.naturalWidth) ctx.drawImage(img, 340, 180, 400, 400);
    }
  } catch(e){ /* pas bloquant — carte affichée sans mascotte si le rendu SVG échoue */ }

  ctx.direction = 'ltr'; // le score reste toujours en chiffres latins, même en arabe
  if(total > 0){
    ctx.fillStyle = lvl.accent;
    ctx.font = "800 130px 'Baloo 2', sans-serif";
    ctx.fillText(`${score} / ${total}`, 540, 710);
  } else {
    ctx.fillStyle = lvl.accent;
    ctx.font = "700 54px 'Baloo 2', sans-serif";
    ctx.direction = currentLang === 'ar' ? 'rtl' : 'ltr';
    ctx.fillText(currentLang === 'ar' ? 'أنجزتُ حصتي!' : 'Séance terminée !', 540, 690);
  }

  ctx.direction = currentLang === 'ar' ? 'rtl' : 'ltr';
  ctx.fillStyle = '#6B7280';
  ctx.font = "600 38px 'Inter', sans-serif";
  ctx.fillText([subjectName, lvl.name[currentLang]].filter(Boolean).join(' · '), 540, 790);

  ctx.fillStyle = '#1B2340';
  ctx.font = "500 32px 'Inter', sans-serif";
  ctx.fillText(TEXT.heroTagline[currentLang], 540, 970);

  await new Promise((resolve) => {
    canvas.toBlob(async (blob) => {
      if(!blob){ resolve(); return; }
      const file = new File([blob], 'smartprof-resultat.png', {type: 'image/png'});
      if(navigator.share && navigator.canShare && navigator.canShare({files: [file]})){
        try { await navigator.share({files: [file], title: 'SmartProf'}); resolve(); return; }
        catch(e){ /* partage annulé/indisponible — repli téléchargement ci-dessous */ }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'smartprof-resultat.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      resolve();
    }, 'image/png');
  });
}

function backToHome(){
  currentSession = null;
  currentTree = null;
  document.getElementById('sessionView').classList.remove('active');
  document.getElementById('sessionView').innerHTML = '';
  document.getElementById('homeView').style.display = '';
}

async function loadSubjects(){
  try {
    const url = activeChild ? `/api/subjects?child_id=${activeChild.id}` : '/api/subjects';
    const res = await fetch(url);
    if(!res.ok) throw new Error('bad status');
    const data = await res.json();
    SUBJECTS = data.map(s => ({
      id: s.id,
      name: {fr: s.name, ar: s.name_ar},
      freeLevels: s.free_levels,
      trialAvailable: !!s.trial_available
    }));
  } catch(e){
    console.warn('Impossible de charger /api/subjects, utilisation des valeurs par défaut.', e);
  }
  render();
}

async function restoreSession(){
  // sessionStorage (not localStorage) on purpose: it's unique per browser tab,
  // so two tabs/devices each keep their own active child and never clash —
  // that's what lets two children run sessions truly in parallel.
  try {
    const raw = sessionStorage.getItem('smartprof_active_child');
    if(raw) activeChild = JSON.parse(raw);
  } catch(e){ activeChild = null; }

  try {
    const res = await fetch('/api/auth/me');
    if(res.ok){ currentUser = await res.json(); }
    else { clearActiveChild(true); }
  } catch(e){ clearActiveChild(true); }
}

function setActiveChild(child){
  activeChild = child;
  try { sessionStorage.setItem('smartprof_active_child', JSON.stringify(child)); } catch(e){}
  currentLevel = Number(child.level_code);
  closeParentView();
  loadSubjects(); // re-fetch so "essai gratuit" reflects this child, not the previous one
}

function clearActiveChild(silent){
  activeChild = null;
  try { sessionStorage.removeItem('smartprof_active_child'); } catch(e){}
  if(!silent) loadSubjects();
}

function openParentView(){
  if(currentSession){ backToHome(); }

  document.getElementById('sessionView').classList.remove('active');
  document.getElementById('parentView').classList.add('active');
  renderParentView();
}

function closeParentView(){
  document.getElementById('parentView').classList.remove('active');
  document.getElementById('parentView').innerHTML = '';
  document.getElementById('homeView').style.display = '';
}

function renderParentView(){
  const view = document.getElementById('parentView');

}

function renderAuthForms(view){
  view.innerHTML = `
    <div class="session-card">
      <div class="parent-tabs">
        <button type="button" class="parent-tab active" id="loginTabBtn">${PARENT_TEXT.loginTab[currentLang]}</button>

        <label class="form-label">${PARENT_TEXT.passwordLabel[currentLang]}</label>
        <input type="password" class="answer-input" id="authPassword" required>
        <div id="authError" class="form-error"></div>
        <div class="session-actions">
          <button type="button" class="btn-secondary" id="parentCloseBtn">${TEXT.backHome[currentLang]}</button>
          <button type="submit" class="btn-primary" id="authSubmitBtn">${PARENT_TEXT.loginSubmit[currentLang]}</button>
        </div>
      </form>
    </div>
  `;

  let mode = 'login';
  const loginTab = document.getElementById('loginTabBtn');
  const registerTab = document.getElementById('registerTabBtn');
  const submitBtn = document.getElementById('authSubmitBtn');

  function setMode(newMode){
    mode = newMode;
    loginTab.classList.toggle('active', mode === 'login');
    registerTab.classList.toggle('active', mode === 'register');
    submitBtn.textContent = mode === 'login' ? PARENT_TEXT.loginSubmit[currentLang] : PARENT_TEXT.registerSubmit[currentLang];
  }
  loginTab.addEventListener('click', () => setMode('login'));
  registerTab.addEventListener('click', () => setMode('register'));
  document.getElementById('parentCloseBtn').addEventListener('click', closeParentView);

  document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const endpoint = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
    let res, data;
    try {
      const body = {email, password};
      if(mode === 'register'){
        let refCode = null;
        try { refCode = localStorage.getItem('smartprof_ref_code'); } catch(e){}
        if(refCode) body.ref = refCode;
      }
      res = await fetch(endpoint, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      });
      data = await res.json();
    } catch(err){
      document.getElementById('authError').textContent = TEXT.genericError[currentLang];
      return;
    }
    if(!res.ok){
      document.getElementById('authError').textContent = localizedError(data);
      return;
    }
    currentUser = data;
    renderParentView();
  });
}

      data = await res.json();
    } catch(err){
      document.getElementById('childError').textContent = TEXT.genericError[currentLang];

    if(!res.ok){

    renderParentView();
  });
}

function renderChildReportContent(view, data){
  const lastActivityText = data.last_activity ? formatRelativeTime(data.last_activity) : REPORT_TEXT.neverActive[currentLang];

  const strengthsHtml = data.strengths.length
    ? `<div class="skill-badges">${data.strengths.map(s => `<span class="skill-badge good">${s.label} (${s.percentage}%)</span>`).join('')}</div>`
    : `<p class="muted-note">${REPORT_TEXT.notEnoughData[currentLang]}</p>`;

  const weaknessesHtml = data.weaknesses.length
    ? `<div class="skill-badges">${data.weaknesses.map(s => `<span class="skill-badge weak">${s.label} (${s.percentage}%)</span>`).join('')}</div>`
    : `<p class="muted-note">${REPORT_TEXT.notEnoughData[currentLang]}</p>`;

  const sessionsHtml = data.recent_sessions.length
    ? data.recent_sessions.map(s => {
        const subj = SUBJECTS.find(x => x.id === s.subject);
        const subjName = subj ? subj.name[currentLang] : s.subject;
        return `<div class="supervision-log-row"><span>${subjName}</span><span class="child-level">${formatRelativeTime(s.created_at)}</span><span class="supervision-log-score">${s.score} / ${s.total}</span></div>`;
      }).join('')
    : `<p class="muted-note">${REPORT_TEXT.noSessions[currentLang]}</p>`;

  const averageDisplay = data.average_this_week !== null ? `${data.average_this_week}%` : '—';

  view.innerHTML = `
    <div class="session-card supervision-card">
      <div class="supervision-header">
        <div class="supervision-avatar">🧑‍🎓</div>
        <div>
          <div class="supervision-name">${data.child.display_name}</div>
          <div class="supervision-status"><span class="status-dot"></span>${REPORT_TEXT.lastActivity[currentLang]} : ${lastActivityText}</div>
        </div>
      </div>

      <div class="stat-grid">
        <div class="stat-tile">
          <div class="stat-icon">📅</div>
          <div class="stat-value">${data.sessions_this_week}</div>
          <div class="stat-label">${REPORT_TEXT.thisWeek[currentLang]}</div>
        </div>
        <div class="stat-tile">
          <div class="stat-icon">🎯</div>
          <div class="stat-value">${averageDisplay}</div>
          <div class="stat-label">${REPORT_TEXT.averageLabel[currentLang]}</div>
        </div>
      </div>
      ${data.sessions_this_week === 0 ? `<p class="muted-note" style="margin:-14px 0 20px;">${REPORT_TEXT.noSessionThisWeek[currentLang]}</p>` : ''}

      <div class="supervision-section">
        <div class="supervision-section-title">💪 ${REPORT_TEXT.strengths[currentLang]}</div>
        ${strengthsHtml}
      </div>

      <div class="supervision-section">
        <div class="supervision-section-title">🎯 ${REPORT_TEXT.weaknesses[currentLang]}</div>
        ${weaknessesHtml}
      </div>

      <div class="supervision-section">
        <div class="supervision-section-title">🕓 ${REPORT_TEXT.recentSessions[currentLang]}</div>
        <div class="supervision-log">${sessionsHtml}</div>
      </div>

      <div class="session-actions" style="justify-content:center;">
        <button type="button" class="btn-secondary" id="reportBackBtn">${REPORT_TEXT.backToDashboard[currentLang]}</button>
      </div>
    </div>
  `;
  document.getElementById('reportBackBtn').addEventListener('click', renderParentView);
}

document.getElementById('parentToggleBtn').addEventListener('click', openParentView);
document.getElementById('activeChildBadge').addEventListener('click', () => clearActiveChild());

captureReferralCode();
restoreSession().then(checkAutoRegister);
loadSubjects();

// Arrive depuis la page vitrine (bouton "Essayer gratuitement" -> /app?register=1) :
// ouvre directement l'inscription au lieu de laisser l'utilisateur rechercher
// le bouton "Espace parent" lui-même — la vitrine a déjà fait la conviction,
// il ne doit rester qu'un clic entre elle et le formulaire.
function checkAutoRegister(){
  if(currentUser) return; // déjà connecté, rien à faire
  try {
    const params = new URLSearchParams(window.location.search);
    if(params.get('register') !== '1') return;
    openParentView();
    const registerTab = document.getElementById('registerTabBtn');
    if(registerTab) registerTab.click();
  } catch(e){ /* param absent ou navigateur ancien — pas bloquant */ }
}

// Parrainage : premier lien cliqué gagne (on ne remplace jamais un code déjà
// mémorisé par une visite ultérieure sans ?ref=), mémorisé jusqu'à
// l'inscription — l'utilisateur peut cliquer le lien, fermer l'onglet,
// revenir plus tard s'inscrire, le parrain reste crédité.
function captureReferralCode(){
  try {
    const params = new URLSearchParams(window.location.search);
    const ref = params.get('ref');
    if(ref && !localStorage.getItem('smartprof_ref_code')){
      localStorage.setItem('smartprof_ref_code', ref.trim().toUpperCase());
    }
  } catch(e){ /* localStorage indisponible — parrainage simplement ignoré */ }
}
</script>
