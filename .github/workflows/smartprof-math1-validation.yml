name: SmartProf Math 1 Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  math1-validation:
    name: Validate Math 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install server dependencies
        run: pip install -r server/requirements.txt

      - name: Seed curriculum database
        run: python server/seed/seed_curriculum.py

      - name: Validate all Math 1 JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path('data/math1').glob('*.json'))
          assert files, 'No Math 1 JSON files found'
          for path in files:
              data = json.loads(path.read_text(encoding='utf-8'))
              assert data is not None
              print(f'OK JSON: {path}')
          PY

      - name: Validate curriculum coverage and translator matrix
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('data/math1')
          c=json.loads((root/'math1_curriculum.json').read_text(encoding='utf-8'))
          m=json.loads((root/'translator_matrix.json').read_text(encoding='utf-8'))
          assert c['level']==1 and c['subject']=='math'
          assert set(c['languages'])=={'fr','ar'}
          expected={(d['id'],s,f) for d in c['domains'] for s in d['skills'] for f in d['exercise_formats'][s]}
          actual={(x['domain'],x['skill'],x['format']) for x in m}
          assert expected==actual, f'Coverage mismatch: missing={expected-actual}, extra={actual-expected}'
          assert all(x.get('fr','').strip() and x.get('ar','').strip() for x in m)
          assert len(m)==len(expected)
          print(f'OK curriculum: {len(c["domains"])} domains, {len(expected)} skill/format mappings')
          PY

      - name: Validate diagnostic engine
        run: |
          python -m py_compile server/diagnostic_engine.py server/models.py server/app.py
          python - <<'PY'
          import sys, json
          sys.path.insert(0,'server')
          from app import app
          from diagnostic_engine import calculate_mastery, mastery_level, diagnose
          assert calculate_mastery(8,10)==80
          assert mastery_level(80)=='Maîtrisée'
          with app.app_context():
              results_by_level = {}
              for level in range(1,6):
                  result=diagnose(str(level),'math',{})
                  assert result, f'no diagnostic rows for level {level} math'
                  assert {x['trimester'] for x in result}=={'T1','T2','T3'}
                  results_by_level[level]=result
          expected={x['skill'] for d in json.load(open('data/math1/math1_curriculum.json',encoding='utf-8'))['domains'] for x in [{'skill':s} for s in d['skills']]}
          got={x['skill'] for x in results_by_level[1]}
          assert expected==got, f'Diagnostic coverage mismatch: missing={expected-got}, extra={got-expected}'
          print('OK diagnostic: levels 1-5 and Math 1 skill coverage')
          PY

      - name: Validate translator JavaScript
        run: |
          node --check web/modules/translator.js
          node - <<'JS'
          const t=require('./web/modules/translator.js');
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('data/math1/math1_curriculum.json','utf8'));
          for(const d of c.domains) for(const s of d.skills) for(const f of d.exercise_formats[s]) {
            const fn = d.id==='pre_numeric' ? 'translateSkill' :
              d.id==='numeration' ? 'translateNumeration' :
              d.id==='calcul' ? 'translateCalcul' :
              d.id==='espace_geometrie' ? 'translateGeometry' :
              d.id==='mesure' ? 'translateMeasures' : 'translateProblems';
            if(!t[fn](s,f)) throw new Error('Missing translation: '+d.id+'/'+s+'/'+f);
          }
          console.log('OK translator: every curriculum skill/format has a runtime translation');
          JS

      - name: Validate SmartProf web entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          p=Path('web/index_smartprof_arabe_complet.html')
          text=p.read_text(encoding='utf-8')
          assert '<html' in text.lower() and '<script' in text.lower() and 'SmartProf' in text
          HTMLParser().feed(text)
          print(f'OK HTML: {p} ({len(text)} characters)')
          PY

      - name: Install library-service dependencies
        run: pip install -r library-service/requirements.txt

      - name: Seed library-service example exercises
        run: python library-service/seed/seed_example_exercises.py

      - name: Validate library-service and Main App sync
        run: |
          python server/app.py &
          SERVER_PID=$!
          python library-service/app.py &
          LIBRARY_PID=$!
          sleep 3

          curl -sf http://127.0.0.1:5001/api/health >/dev/null
          curl -sf http://127.0.0.1:5000/api/health >/dev/null

          UNAUTHORIZED=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5001/api/v1/exercises/export)
          if [ "$UNAUTHORIZED" != "401" ]; then
            echo "expected 401 without API key, got $UNAUTHORIZED"
            kill $SERVER_PID $LIBRARY_PID
            exit 1
          fi

          python server/sync/library_sync.py

          kill $SERVER_PID $LIBRARY_PID

          python - <<'PY'
          import sys
          sys.path.insert(0, 'server')
          from app import app
          from models import LibraryCacheExercise
          with app.app_context():
              count = LibraryCacheExercise.query.count()
          assert count >= 1, 'sync pulled zero exercises into the Main App cache'
          print(f'OK sync: Main App cache holds {count} exercise(s) pulled from library-service')
          PY
